<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fetch API</title>
    <link rel="stylesheet" href="fetch.css" />
  </head>
  <body>
    <form>
      <fieldset>
        <legend>Student Registration Form</legend>
        <div>
          <label id="name">Name</label
          ><input type="text" required name="name" />
        </div>
        <div>
          <label itemref="fname">Father Name</label
          ><input type="text" required name="fname" />
        </div>
        <div>
          <label id="mname">Mother Nmae</label
          ><input type="text" required name="mname" />
        </div>
        <div>
          <label id="class">Class</label
          ><input type="number" required name="class" />
        </div>
        <div>
          <label id="add">Address</label
          ><input type="text" required name="add" />
        </div>
        <div>
          <label id="DOB">DOB</label><input type="date" required name="DOB" />
        </div>
        <div>
          <label id="num">Phone Number</label
          ><input type="number" required name="num" />
        </div>
        <div>
          <label id="em">Email</label><input type="email" required name="em" />
        </div>
        <div>
          <label>Gender</label><br /><input
            type="radio"
            name="radio"
            value="male"
          />
          <label>Male</label
          ><input type="radio" name="radio" value="female" /><label
            >Female</label
          ><input type="radio" required value="other" /><label>Other</label>
        </div>
      </fieldset>
      <button type="submit" id="btn">Submit</button>
      <button type="reset">Reset</button>
    </form>

    <script src="main.js"></script>
  </body>
</html>
